<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Shield Rim -->
  <path d="M 256 32 C 340 32, 432 56, 448 88 C 456 220, 396 384, 256 480 C 116 384, 56 220, 64 88 C 80 56, 172 32, 256 32 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#glowGrad)" 
        stroke-width="14" 
        filter="url(#neonGlow)"/>

  <!-- Inner Shield Accent -->
  <path d="M 256 64 C 324 64, 396 84, 412 110 C 418 214, 370 348, 256 432 C 142 348, 94 214, 100 110 C 116 84, 188 64, 256 64 Z" 
        fill="none" 
        stroke="#00F2FE" 
        stroke-width="3" 
        stroke-opacity="0.4"/>

  <!-- Stylized 'S' Emblem (SERU GUARD) -->
  <path d="M 330 160 C 270 145, 190 155, 190 205 C 190 265, 335 245, 335 315 C 335 375, 240 380, 180 355 M 325 160 L 340 185 M 180 355 L 165 330" 
        fill="none" 
        stroke="url(#glowGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)"/>

  <!-- Core Shield Dot / Power Node -->
  <circle cx="256" cy="260" r="10" fill="#00F2FE" filter="url(#neonGlow)"/>
</svg>

